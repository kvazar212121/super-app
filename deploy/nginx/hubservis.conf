# hubservis.uz — faqat HTTP (port 80)
# SSL server admin boshqa qatlamda qo'yadi — bu yerda https/redirect yo'q
#
# hubservis.uz      → Landing (/) + Admin (/admin)
# api.hubservis.uz  → Backend API
#
# O'rnatish:  sudo bash scripts/apply-nginx.sh

upstream superapp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket ulanishlar uchun map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Gzip — barcha server bloklarga tegadi (trafik va tezlik)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           text/javascript application/xml image/svg+xml application/wasm;

# ── IP orqali kirish (default) ───────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    # WebSocket signaling endpoint
    location /api/v1/calls/ws {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API: api.hubservis.uz ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.hubservis.uz;

    client_max_body_size 20M;

    # WebSocket signaling endpoint
    location /api/v1/calls/ws {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

