# hubservis.uz — faqat HTTP (port 80)
# SSL server admin boshqa qatlamda qo'yadi — bu yerda https/redirect yo'q
#
# hubservis.uz      → Landing (/) + Admin (/admin)
# api.hubservis.uz  → Backend API
#
# O'rnatish:  sudo bash scripts/apply-nginx.sh

upstream superapp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── IP orqali kirish (default) ───────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API: api.hubservis.uz ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.hubservis.uz;

    client_max_body_size 20M;

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ── Landing + Admin: hubservis.uz ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hubservis.uz www.hubservis.uz;

    client_max_body_size 20M;

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
