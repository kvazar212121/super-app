# hubservis.uz — production nginx
# Server IP: 47.84.60.201
#
# O'rnatish:
#   sudo cp deploy/nginx/hubservis.conf /etc/nginx/sites-available/hubservis
#   sudo ln -sf /etc/nginx/sites-available/hubservis /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d hubservis.uz -d www.hubservis.uz -d api.hubservis.uz

upstream superapp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── IP orqali kirish (default) ───────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 47.84.60.201;

    client_max_body_size 20M;

    location = / {
        return 302 /admin/login;
    }

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location / {
        return 302 /admin/login;
    }
}

# ── Backend API: api.hubservis.uz ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.hubservis.uz;

    client_max_body_size 20M;

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ── Admin panel: hubservis.uz ──────────────────────────────────────────────
# Admin JS /api/v1 ga nisbiy yo'l bilan murojaat qiladi — shu domen orqali.
server {
    listen 80;
    listen [::]:80;
    server_name hubservis.uz www.hubservis.uz;

    client_max_body_size 20M;

    # Asosiy sahifa → admin login
    location = / {
        return 302 /admin/login;
    }

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    # Boshqa yo'llar → admin
    location / {
        return 302 /admin/login;
    }
}
