# hubservis.uz — production nginx
# Server IP: 47.84.60.201
#
# hubservis.uz     → Landing (/) + Admin (/admin) — backend orqali
# api.hubservis.uz → Backend API
#
# O'rnatish:  bash scripts/setup-nginx.sh
# HTTPS:       bash scripts/setup-ssl.sh

upstream superapp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── IP orqali kirish (default) ───────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 47.84.60.201;

    client_max_body_size 20M;

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API: api.hubservis.uz ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.hubservis.uz;

    client_max_body_size 20M;

    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ── Landing + Admin: hubservis.uz ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hubservis.uz www.hubservis.uz;

    client_max_body_size 20M;

    location /admin {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-assets/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://superapp_backend;
        proxy_set_header Host $host;
    }

    # Landing (/) va boshqa yo'llar — backend
    location / {
        proxy_pass http://superapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
