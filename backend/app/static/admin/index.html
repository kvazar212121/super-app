<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>HubServis &mdash; Boshqaruv Paneli</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/admin-assets/css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">&#9889;</div>
                <span class="sidebar-brand">HubServis</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Asosiy</div>
                <div class="nav-item active" data-page="dashboard">
                    <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span>
                    <span class="nav-label">Bosh sahifa</span>
                </div>
                <div class="nav-section-title">Boshqaruv</div>
                <div class="nav-item" data-page="users">
                    <span class="nav-icon"><i data-lucide="users"></i></span>
                    <span class="nav-label">Foydalanuvchilar</span>
                </div>
                <div class="nav-item" data-page="providers">
                    <span class="nav-icon"><i data-lucide="briefcase"></i></span>
                    <span class="nav-label">Soha egalari</span>
                </div>
                <div class="nav-item" data-page="orders">
                    <span class="nav-icon"><i data-lucide="shopping-bag"></i></span>
                    <span class="nav-label">Buyurtmalar</span>
                </div>
                <div class="nav-item" data-page="categories">
                    <span class="nav-icon"><i data-lucide="folder"></i></span>
                    <span class="nav-label">Kategoriyalar</span>
                </div>
                <div class="nav-item" data-page="products">
                    <span class="nav-icon"><i data-lucide="package"></i></span>
                    <span class="nav-label">Mahsulotlar katalogi</span>
                </div>
                <div class="nav-item" data-page="promos">
                    <span class="nav-icon"><i data-lucide="tag"></i></span>
                    <span class="nav-label">Aksiyalar</span>
                </div>
                <div class="nav-item" data-page="reviews">
                    <span class="nav-icon"><i data-lucide="star"></i></span>
                    <span class="nav-label">Sharhlar</span>
                </div>
                <div class="nav-item" data-page="reports">
                    <span class="nav-icon"><i data-lucide="bar-chart-2"></i></span>
                    <span class="nav-label">Hisobotlar</span>
                </div>
                <div class="nav-item" data-page="user_analytics">
                    <span class="nav-icon"><i data-lucide="pie-chart"></i></span>
                    <span class="nav-label">Foydalanuvchi odatlari</span>
                </div>
                <div class="nav-section-title">Moliya va Tizim</div>
                <div class="nav-item" data-page="finance">
                    <span class="nav-icon"><i data-lucide="dollar-sign"></i></span>
                    <span class="nav-label">Moliya</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <span class="nav-icon"><i data-lucide="settings"></i></span>
                    <span class="nav-label">Sozlamalar</span>
                </div>
                <div class="nav-item" data-page="notifications">
                    <span class="nav-icon"><i data-lucide="bell"></i></span>
                    <span class="nav-label">Bildirishnomalar</span>
                    <span class="nav-badge">3</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <div class="main-area">
            <!-- TOPBAR -->
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>
                <div class="topbar-search">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" placeholder="Qidirish..." id="globalSearch">
                </div>
                <div class="topbar-actions">
                    <div class="topbar-avatar">
                        <div class="topbar-avatar-info">
                            <div class="topbar-avatar-role" style="font-size: 16px; font-weight: 700; color: var(--primary);">Super Admin</div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- CONTENT -->
            <main class="content" id="mainContent">
                <!-- Pages rendered here -->
            </main>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Modal</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="/admin-assets/js/main.js"></script>
</body>
</html>
