# Coturn TURN/STUN server konfiguratsiyasi — hubservis.uz
# Faqat ovozli qo'ng'iroqlar (WebRTC audio relay) uchun

# Asosiy tinglash portlari
listening-port=3478
tls-listening-port=5349

# Relay IP — barcha interfeyslarda tinglash
relay-ip=192.168.101.49
external-ip=185.203.236.101/192.168.101.49

# UDP relay portlar diapazoni
min-port=49152
max-port=65535

# Xavfsizlik
fingerprint
lt-cred-mech
realm=hubservis.uz

# Foydalanuvchi credentials (long-term)
# TODO(security): Ishlab chiqarishda vaqtinchalik HMAC credentials ga o'tish tavsiya etiladi
user=superapp:SuperApp2026Turn!

# CLI va zaif TLS versiyalarini o'chirish
no-cli
no-tlsv1
no-tlsv1_1

# Verbose logging (debug uchun, keyinchalik o'chirish mumkin)
verbose

# Stale nonce — xavfsizlik uchun
stale-nonce=600

# Faqat UDP relay (TCP relay ham yoqildi barqarorlik uchun)
# no-tcp-relay
